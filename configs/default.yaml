experiment:
  seed: 2026
  image_size: 256
  label_ratios: [0.05, 0.10, 0.20, 0.50, 1.00]
  subset_seeds: [2026, 2027, 2028]

offline_teacher:
  folds: 5
  seed_model: MobileNetV3-Small-Siamese
  c2f_scpt:
    alpha: 1.0
    beta: 0.7
    gamma: 0.7
    candidate_threshold: 0.45
    min_component_area: 16
    transform_hierarchy: [affine, similarity, local_phase_translation, global_phase_translation, no_transport]
  sam2:
    variant: sam2.1_hiera_large
    top_k: 3
  narp_us:
    selector: [18, 32, 32, 2]
    relative_utility_threshold: 0.05
    usability_threshold: 0.70
    null_reliability_threshold: 0.60
  relation_teacher:
    model: dinov2_vits14
    coarse_radius: 6
    fine_radius: 2
    coarse_classes: 170
    fine_classes: 25

student:
  backbone: MobileNetV3-Small
  relation_code_channels: 24
  rtec_clip: 2.0

training:
  optimizer: AdamW
  weight_decay: 0.0001
  backbone_lr: 0.0001
  head_lr: 0.0003
  batch_size: 16
  gradient_clip_norm: 1.0
  stages:
    s0_epochs: 40
    s1_epochs: 100
    s2_epochs: 30
  losses:
    lambda_pl: 1.0
    lambda_rel: 0.5
    lambda_f: 1.0
    lambda_disp: 0.1
    lambda_cyc: 0.1
    lambda_final: 1.0
    lambda_excl: 0.05
    lambda_mag: 0.01
